[cpu]
; 1 = sleep on a high-resolution timer instead of spinning, then spin only the last 1-2 ms.
; 0 = leave the spin, only log "loop 5s:" timings. Restart required.
; An enabled standalone Update Loop Sleep keeps ownership; disable it to use this setting.
update_loop_sleep=1

[narrowphase]
; 1 = log "narrowphase 5s:" blocks in physics_fixes.log: time in Bullet's per-pair collision code, split by
; pair class (G = ghost, D = dynamic body, S = static; shape: compound, box, hull, capsule, ...), then
; the 12 objects whose pairs cost the most (position, compound child count, owner class, partner).
measure=0
; 0 = off. 1 = skip every character sensor ghost pair: BREAKS characters (always in the air, no jump).
skip_ghost_pairs=2
; 1 (default) = also skip the sensor-ghost checks of SEATED characters (NPC crews in seats, seated
skip_seated_ghosts=1
; 1 = a convex (hull block, wheel, character capsule) vs triangle mesh (terrain, harbour tiles) skips GJK for a
; triangle when the convex's box lies wholly on one side of the triangle's plane by more than tri_cull_slack_cm
; (Bullet keeps contacts up to 2 cm apart). Hull blocks vs big terrain triangles were ~24% of collision time.
tri_cull=1
tri_cull_slack_cm=20
; 1 = box vs capsule / sphere pairs (vehicle blocks vs characters' body, feet and sensor capsules) get their contact
; in closed form (~0.1 us) instead of GJK + EPA, which was most of the physics thread near crewed AI ships. Same depth
; game: check walking / jumping on vehicles, seats, ladders, swimming next to hulls. "box contacts 5s" lines.
box_contacts=0

[bullet]
; 1 = time every Bullet profiling scope (step phases, broadphase, narrowphase, solver, ...) per thread
; with the CPU cycle counter: "bullet 5s" trees in physics_fixes.log. Replaces Bullet's own, slower profiler.
profile=0
; With profile=0: 1 = Bullet's built-in profiler off (two timer reads per scope; nothing reads them).
profiler_off=1
; 1 = under Wine / Proton, Bullet's memory comes from per-thread arenas instead of the game heap, whose single
;     Windows' heap doesn't have that problem. 2 = also on Windows, 0 = off.
heap=1
; 1 = count convex hull support calls (the hottest physics function): calls/s, vertices per call, cycles, distinct
;     hulls. "hull support 5s" lines, log only.
hull_count=0

[sanity]
; 1 = every physics object is checked every tick; one that reaches an impossible position (not finite or > 1e6 m)
;     or jumps > 100 m in a tick is described in the log with its next 8 positions ("sanity" lines). Log only.
enabled=1

[census]
; Logging only (the step hook always runs). 1 = every 5 s: physics step calls / sub-steps / time ("step 5s"), and every object in the physics
; world by type, the characters, and the biggest vehicle bodies with the characters near them ("census 5s").
enabled=0

[compound]
; 1 = cache the vehicle-vs-vehicle-body tree walk (a ship's turrets/doors/pistons against its own hull):
; the same block pairs, in the same order, without re-walking both block trees every physics step.
; Checks itself against the original walk every 64th time and switches off if they ever differ.
cache=1
; How far (m) blocks may move relative to each other before the cached walk is redone.
margin=0.05

[parallel]
; Early launch is disabled by the stability audit in 0.26.5, including existing values of 1.
; Contact damage/tree teardown still has unsafe shared ownership while logic runs.
; The native physics/logic order is retained; the parallel phases below remain available.
early_launch=0
; Collision pairs on several threads (each ship's contacts are independent). 0 = auto (logical
; processors - 2, at most 6), 1 = off (single thread as in the game), or a number of threads.
threads=0
; Dispatches with fewer pairs than this run on one thread (not worth waking the workers).
min_pairs=256

[render]
; 1 = an object at an impossible position (not finite, or beyond 1e9 m) gets a zero bounding sphere instead of
;     logged ("render guard" lines). 0 = off.
bounds_guard=1
; instead of the heap; the render side gives them back when it frees them.
scratch_buffers=1
; Pool size per buffer size (16-...). When it runs out, buffers come from the heap as before.
pool_slots=512
; 1 = log "render bodies 5s": the per-body effect buffers (quads / particles) render prep rebuilds every
measure_body_buffers=0
; 1 = skip rebuilding a body's effect-quad buffer while every quad is dead and the render side already
; holds the all-zero buffer (re-sent when anything changes, and every 0.5 s). ~87% of bodies near AI ships.
skip_dead_quads=1
; The per-vehicle draw loop of the render scene preparation (~40-50% of it near AI ships) on
; several threads: each thread runs the game's own loop code on a copy of its stack frame and its own copy of the
; render list, vehicles are claimed one by one, and the results are joined in the game's order (the same render
; list as the original loop). off = the game's loop. single = all of that machinery on one thread (a check).
; if the render list changes anywhere it shouldn't.
parallel_prep=parallel
; 0 = auto (logical processors - 2, at most 6), including the update thread.
prep_threads=0
; 1 = while drawing, each thread allocates from its own heap (the shared heap lock made 6 threads ~3-4x slower
; each). Needs the _aligned_free hook (render_scratch, or its own when scratch_buffers=0).
prep_heaps=1

[vehicle_logic]
; Run the per-vehicle logic (components, engines, sensors, microcontrollers) of different
; vehicles on several threads. Vehicles linked by connectors / docks (and all vehicles with rope hooks)
; stay together on one thread; physics events, network events, raycasts, sounds, effects and Lua are
; serialized by one lock. off = the game's loop. serial = this mod's loop on one thread (same as the game).
; grouped = vehicle groups one after another on one thread with all the parallel machinery (a check).
mode=parallel
; In parallel mode, run grouped for this many seconds after the world starts first (0 = parallel at once).
grouped_first_s=0
; 0 = auto (logical processors - 2, at most 6), including the update thread.
threads=0
; Fewer vehicles than this run the game's own loop.
min_vehicles=8
; 1 = every vehicle with a radio antenna runs in one group, on one thread, in the game's order. Radio has no link the
; grouping can follow, so a receiver and its sender used to run on different threads in a different order every tick:
; pulses doubled or lost and half-updated composites ("logic outputs garbage" with mode=parallel). 0 = as before 0.26.9.
group_radios=1
; Finding what breaks a vehicle's logic, in one session. N = seconds per stage, 0 = off (needs mode=parallel). The loop
; then changes every N seconds by this PC's clock through 7 stages: 1 the game's own loop, 2 this mod's loop on one
; thread, 3 groups on one thread with the locks, 4 several threads with raycasts and sensor scans locked, 5 raycasts
; unlocked, 6 sensor scans on copies, 7 everything (the normal setting). Drive the vehicle that misbehaves, note the
; clock time when it does and when it stops, and send physics_fixes.log: its "ISOLATE: now stage" lines say which
; stage ran then. 30 is a good value (3.5 minutes for all stages). Costs performance in stages 1-3.
isolate_s=0
; 1 = read-only shared-system calls share the lock (SRW reader / writer lock). 0 = one exclusive lock
reader_lock=0

; world's source lists and run without the lock; a source added during the loop is seen next tick. Copies are checked
; against the live lists after every loop ("sensor lists" line).
snapshot_sensors=1

[serialize]
; Writing vehicles out (the host sending a vehicle to a player when it spawns in multiplayer; every save and
; autosave) freezes the game: half of that time is the shared heap handing out one small string per attribute.
; 1 = while vehicles are written, allocate from a private heap instead.
private_heap=1
; 1 = compress with libdeflate instead of the game's miniz: 2.2x faster and 5-9% smaller on real vehicles, same
; zlib format (players without the mod read it as before).
fast_compress=1
; libdeflate level, 1 (fastest) .. 12 (smallest). 6 is both faster and smaller than the game's compressor.
level=6
; Decompress and compare the first N compressed outputs; any difference switches back to the game's compressor.
verify_calls=64
; Log every vehicle request / save that takes at least this long, split into its parts ("serialize:" lines).
log_ms=20
; 1 = when a player asks for several vehicles at once (joining: every vehicle near them), write them on several
; everyone). Host only; the reply is the same bytes.
parallel_requests=1
; The first N vehicles written that way are also written the game's way and compared (then every 16th); any
; difference switches it off for the session.
parallel_check=8

[broadphase]
; 1 = Bullet's deferred broadphase pairs (m_deferedcollide): a moved object's new pairs are found by one tree walk
deferred_pairs=0
; 1 = update only awake objects' AABBs each step (Bullet m_forceUpdateAllAabbs = 0); the game updates teleported
active_aabbs_only=0
; several threads after all objects are moved, and the pairs are added in the game's object order. Searches see the
; fully updated tree, so a pair that only touched an object's old fat box is not added (it can't have contacts).
parallel_pairs=1
; 0 = auto (logical processors - 2, at most 6), including the physics thread.
threads=0
; Bullet's broadphase leaf prediction: a moved object's tree box is stretched by half its size x this in the direction
; it moves, so it isn't taken out of the tree and put back (and searched again) every sub-step. Bullet's default 0
; does that for everything moving faster than 9 m/s (~800 objects per sub-step near AI ships). Bigger = fewer tree
; updates but more pairs whose boxes overlap without touching. -1 = keep the game's value.
prediction=0.25
; 1 = the objects' boxes (updateAabbs, ~4000 objects every sub-step near AI ships) are computed on the physics pool and
; handed to the broadphase in the game's order; bit-for-bit self-check every verify_every sub-steps. 0 = the game's loop.
parallel_aabbs=1

[solver]
; parallel (default) = solve the physics islands (groups of bodies touching / joined) on several threads, each with
; thread only (a check). off = the game's own solver loop. Falls back to the game's loop if a check fails.
parallel=parallel
; 0 = auto (logical processors - 2, at most 6), including the physics thread.
threads=0
; 1 = log "solver 5s" blocks: the constraint solver per sub-step (islands by size, every solveGroup call's setup /
; iterations / finish time, iterations used, solver rows, contacts by pair class with depth, joint types, the 10
; costliest units with what is in them and where), and how it would split over 2-8 threads.
log=0
; With parallel=off: 1 = every other 5 s window solves each island on its own (Bullet's min batch size 1) so each
; island gets an exact time.
split_alternate=1

[sound]
; 1 = the per-tick sound volume pass (each sound ducked by louder sounds of the same name) in one sweep instead of
fast_mix=1
; Every Nth pass also runs the game's own code on all sounds and compares bit for bit; any difference turns
; fast_mix off. 0 = never.
verify_every=64

[radar]
; 1 = tick message 0x94 (radar event for a vehicle) uses a cached list of the vehicle's radar components instead of
; the vehicle's current components every time; a full walk is compared every verify_every-th hit.
cache_messages=1
verify_every=64

[rain]
; ~100 characters). Reuse each character's last answer until it moves move_cm or refresh_ms passes.
cache_shelter=1
refresh_ms=300
move_cm=100
; Length of the shelter ray in m (game: 10000). Anything overhead within this distance still shelters.
max_ray_m=2000

[heat]
; 1 = temperature queries (characters every tick, engines / steam / water / nuclear / sensors) reuse each vehicle's
; bounding box for the rest of the tick instead of rebuilding every vehicle's box per query (~17k boxes per tick near AI
; ships). Cleared when the physics results have been applied; every verify_every-th reuse is compared with a fresh box.
cache_boxes=1
verify_every=64
; each ghost only rebuilds its own contact list.
parallel_ghosts=1

[catchup]
; When you join someone and your game is far behind (more than behind_ticks host ticks queued): skip the physics step
; for up to max_skip_in_row of every max_skip_in_row + 1 replayed ticks. Events and vehicle logic still run every tick;
; other vehicles, objects and characters follow the host anyway. Only while your character is seated, inside a workbench
; / UI screen, or not spawned yet. 0 = off.
skip_physics=1
behind_ticks=60
max_skip_in_row=2
; If queued ticks exceed this threshold, allow skipping physics steps even while walking to prevent catch-up traps. 0 = off.
emergency_skip_ticks=100

[puppets]
; When you join someone: every other player's and NPC's character is a puppet the game puts where the host says, every
; tick. 1 = their bodies skip collisions with everything except your own character (you still bump into them), so
; Bullet stops computing contacts it overwrites the next tick (the biggest part of a client's collision time near crews).
; Does nothing on the host or in single player. 0 = off.
cull=1
; 1 = their sensor ghosts also skip collisions and contact gathering. If other players or NPCs look stuck in a falling /
; in-the-air animation, set 0: the ghosts run as before and only the bodies stay culled.
cull_ghosts=1

[hull_tasks]
; Every vehicle body's air / water pass (hull drag, buoyancy, flooding; Realistic Aero's face forces run inside it)
; parallel (default) = those tasks on a pool, one vehicle's bodies together on one thread, vehicles at once; the one
; shared list they write (water flowing between compartments) is locked. serial = this mod's loop, every task on
; the queue's own thread as the game (a check). off = the game's own loop.
mode=parallel
; 0 = auto (4)
threads=0
; 1 = a body's hull force list keeps its memory between ticks instead of being freed every tick and grown again by
; the task (several allocations per body per tick). 0 = as the game.
keep_ring=1

[particles]
; remain are put back in their order. 0 = the game's loop.
parallel=1
; 0 = auto (4) helper threads besides the update thread
threads=0
; fewer emitters than this: one thread, as the game
min_emitters=64

[lod]
; every remote player's (on the host and on clients alike). "lod 5s" lines; the census and vehicle-logic "by distance"
; rings use the nearest player.
enabled=1
; Far = every player farther than far_m; near again once one comes within near_m.
far_m=1200
near_m=1000
; 1 = seated crew (non-player characters in a seat) that are far skip their body collisions; they collide again the
; step they stand up or a player comes near. Rays still hit them.
crew=0
; Distant AI logic (LOD T2): AI-crewed vehicles at sea level that are far from every player run their logic only one
; they keep going. 0 off, 1 on, 2 compare (each unit alternates between decimated and full logic every 30 s; the
logic=0
logic_n=3
; instead of three. Only crewed AI ships in the distant-AI-logic set that no player ever sat in or came within 300 m of;
; never within 1000 m of any player; never a player's body; released the tick after touching anything else. Self-checks
; switch it off for the session. Needs logic=1 (or 2 / 3), [solver] parallel and the parallel narrowphase.
physics=0

[probes]
; particles, characters (split by seated / walking and distance to the nearest player) and loose objects, the contact
; callback (with manifold counts), character containment, the zone 0x33 per-body pass, the hull setup's water rays and
enabled=0
