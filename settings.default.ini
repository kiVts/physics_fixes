;@ Multithreading
[multithreading]
;@ Multithread Lua
; 1 = microcontroller Lua scripts run on several threads at once instead of one at a time. Each script still runs on
; one thread at a time, and a script that calls something outside the checked list (for example async.httpGet) runs
; the rest of that tick the old way. Turns itself off if the game's Lua code isn't the checked code.
; 0 = Lua scripts one at a time, as before. Needs Multithread vehicle logic.
lua=1
;@ Multithread vehicle logic
; 1 = the logic of different vehicles (components, engines, sensors, microcontrollers) runs on several threads;
; vehicles joined by connectors, docks or ropes stay together. 0 = the game's own loop on one thread.
vehicle_logic=1
;@ Multithread radio vehicles
; 1 = vehicles with radio antennas also run on several threads; radio signals are still exchanged in the game's order.
; 0 = all vehicles with antennas run together on one thread.
radio=0
;@ Multithread physics
; 1 = collisions, the physics solver, character contacts, buoyancy and drag run on several threads.
; 0 = the game's own physics on one thread.
physics=1
;@ Multithread rendering
; 1 = preparing vehicles for drawing, and particles (smoke, spray, trails), run on several threads.
; 0 = the game's own loops.
rendering=1

;@ CPU
[cpu]
;@ Sleep instead of busy-waiting
; 1 = between ticks the game sleeps on a precise timer instead of spinning a CPU core: less CPU use and heat, same
; timing. 0 = the game's busy wait. An enabled standalone Update Loop Sleep mod takes precedence.
update_loop_sleep=1

;@ Multiplayer
[catchup]
;@ Skip physics while catching up
; 1 = when you join someone and your game is far behind the host, some physics steps are skipped while you are seated,
; in a workbench or menu, or not spawned yet, so you catch up sooner. 0 = off.
skip_physics=1

;@ Multiplayer
[puppets]
;@ Simplify other players' sensors
; 1 = when you join someone, other players' and NPCs' sensor ghosts skip collisions on your PC (less physics work).
; 0 = off: use this if other players or NPCs look stuck in a falling animation.
cull_ghosts=1
