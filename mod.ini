[mod]
id=physics_fixes
name=Physics Fixes
version=0.26.6
author=Kivts
summary=Multithreaded physics and game logic for heavy worlds: collision checks, the constraint solver, the broadphase and the per-vehicle logic on several threads, parallel render preparation, plus fixes for the sound mixer, radar messages, character sensor checks and vehicle saving. Most of them check themselves against the game's own code and switch off on a mismatch. Logs timing every 5 s in physics_fixes.log.
dll=physics_fixes.dll
multiplayer=local
default_enabled=1
